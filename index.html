<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>Balanço Império</title>
<style>
:root{
  --navy:#0f172a;--orange:#f28b22;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;
  --bg:#f1f5f9;--green:#16a34a;--yellow:#ca8a04;--red:#dc2626;--card:#fff;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100svh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0b1220,#1e293b 60%)}
.loginbox{width:min(100%,380px);background:var(--card);padding:28px 24px;border-radius:20px;box-shadow:0 24px 60px #0005}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#ffb65d,var(--orange));display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;flex-shrink:0}
.brand b{display:block;font-size:15px;letter-spacing:.04em}.brand small{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.12em}
h1{font-size:22px;margin:20px 0 6px;letter-spacing:-.03em}
.muted{color:var(--muted)}.small{font-size:12px}
.field{display:grid;gap:6px;margin:14px 0}
.field label{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;outline:none;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f28b2225}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:.15s}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.primary{background:var(--orange);color:#fff;box-shadow:0 4px 14px #f28b2235}
.dark{background:var(--navy);color:#fff}.soft{background:#e2e8f0;color:#334155}.danger{background:#fef2f2;color:var(--red)}.full{width:100%}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:wait}
.icon-btn{width:40px;height:40px;min-width:40px;padding:0;border-radius:11px;display:inline-grid;place-items:center;border:0;background:#e2e8f0;color:#475569}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.edit{background:#fff7ed;color:#c2410c}.icon-btn.delete{background:#fef2f2;color:#b91c1c}
.icon-btn.toggle{background:#ecfdf5;color:#15803d}.icon-btn.off{background:#f1f5f9;color:#94a3b8}
.icon-btn:active{transform:scale(.94)}
.access-choice{display:grid;gap:10px;margin-top:20px}
.access-choice .btn{min-height:52px;font-size:15px}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;min-height:56px;box-shadow:0 4px 20px #0004}
.top .logo{width:36px;height:36px;font-size:14px;border-radius:10px}
.top .brand b{font-size:13px}.top .brand small{display:none}
.top-actions{display:flex;align-items:center;gap:8px}
.container{max-width:560px;margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}
.welcome{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.welcome h2{margin:0;font-size:20px;letter-spacing:-.03em;font-weight:800}
.status-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0;box-shadow:0 0 0 3px #0000000a}
.status-dot.OK{background:var(--green)}.status-dot.AGUARDANDO{background:#eab308}.status-dot.DIVERGENTE{background:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px #0f172a08}
.searchbox{position:relative}
.searchbox input{padding-left:42px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:240px;overflow:auto;z-index:10;box-shadow:0 12px 32px #0f172a20}
.option{display:block;text-align:left;width:100%;padding:12px 14px;background:#fff;border:0;border-bottom:1px solid var(--line);font-size:14px}
.option:hover,.option:active{background:#fff7ed}
.countbox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.countbox .code{font:700 11px ui-monospace,monospace;color:var(--muted)}
.countbox .desc{font-weight:700;margin:2px 0 4px}
.countbox .unit{font-size:11px;color:var(--muted)}
.qty-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:12px}
.qty-row .field{margin:0}
.obs-toggle{width:44px;height:44px}
.obs-field{margin-top:8px}
.stat-chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.stat-chip strong{font-size:16px}
.list{display:grid;gap:8px;margin-top:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff}
.iteminfo{min-width:0;flex:1}.code{font:700 11px ui-monospace,monospace;color:var(--muted)}.desc{font-weight:700;font-size:14px;overflow-wrap:anywhere}.unit{font-size:11px;color:var(--muted)}.observation{font-size:12px;color:var(--muted);margin-top:2px}
.item-tools{display:flex;align-items:center;gap:6px;flex-shrink:0}.item-value{font-weight:800;font-size:15px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:20px;font-size:13px}
.toast{position:fixed;z-index:50;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;max-width:90vw;text-align:center;font-size:13px;font-weight:600;box-shadow:0 8px 24px #0004}
.own-list-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0;border:0;background:transparent;color:var(--ink);font:800 14px system-ui;cursor:pointer}
.own-list-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.own-list-toggle[aria-expanded="false"] svg{transform:rotate(-90deg)}
.own-filter{margin-top:12px}
.own-filter select{font-size:13px;font-weight:600;padding:10px 12px}
.own-list-collapsed{display:none!important}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em}
.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
.admin-tools{display:flex;gap:8px;margin:8px 0 16px}
.team-card .unit{font-size:11px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}
.accesscode{background:#fff7ed;border:1px solid #fdba74;border-radius:12px;padding:12px;margin:0 0 12px;font:700 12px ui-monospace,monospace;overflow-wrap:anywhere}
@media(max-width:400px){
  .container{padding:12px 10px calc(24px + env(safe-area-inset-bottom))}
  .panel{padding:14px;border-radius:14px}
  .icon-btn{width:36px;height:36px;min-width:36px}
  .welcome h2{font-size:18px}
}
</style>
</head>
<body>
<div id="start" class="login">
 <div class="loginbox">
  <div class="brand"><div class="logo">BI</div><div><b>BALANÇO IMPÉRIO</b><small>INVENTÁRIO</small></div></div>
  <section id="createPanel">
   <h1>Acesso</h1>
   <div class="access-choice">
    <button id="showAdmin" class="btn dark full" type="button"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Admin</button>
    <button id="showCode" class="btn primary full" type="button"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Equipe</button>
   </div>
  </section>
  <section id="adminLoginPanel" class="hidden">
   <h1>Admin</h1>
   <form id="adminLoginForm">
    <div class="field"><label>E-mail</label><input id="adminEmail" type="email" required autocomplete="username" placeholder="seu@email.com"></div>
    <div class="field"><label>Senha</label><input id="adminPassword" type="password" required autocomplete="current-password"></div>
    <button id="adminLoginBtn" class="btn primary full" type="submit">Entrar</button>
   </form>
   <button id="backHomeAdmin" class="btn soft full" type="button" style="margin-top:8px">Voltar</button>
  </section>
  <section id="adminPanel" class="hidden">
   <div class="row between" style="margin-bottom:4px"><h1 style="margin:0;font-size:20px">Admin</h1><button id="adminLogout" class="icon-btn" type="button" title="Sair" aria-label="Sair"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button></div>
   <div class="admin-tools">
    <button id="exportCounts" class="icon-btn edit" type="button" title="Baixar Excel" aria-label="Baixar Excel"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 17v3h14v-3"/></svg></button>
    <button id="shareCounts" class="icon-btn toggle" type="button" title="Compartilhar Excel" aria-label="Compartilhar Excel"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"/></svg></button>
   </div>
   <form id="adminCreateForm">
    <div class="field"><label>Nome da equipe</label><input id="adminTeamName" required minlength="2" maxlength="60" placeholder="Ex.: Equipe 3"></div>
    <div class="field"><label>Senha</label><input id="adminTeamPassword" type="password" required minlength="6" placeholder="Mín. 6 caracteres"></div>
    <button id="adminCreateBtn" class="btn primary full" type="submit"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Cadastrar</button>
   </form>
   <div class="divider">EQUIPES</div>
   <div id="adminTeamsList" class="list"></div>
  </section>
  <section id="codePanel" class="hidden">
   <h1>Equipe</h1>
   <form id="codeForm">
    <div class="field"><label>Nome da equipe</label><input id="accessCode" type="text" required placeholder="Ex.: Equipe 1" autocomplete="organization"></div>
    <div class="field"><label>Senha</label><input id="teamPassword" type="password" required autocomplete="current-password"></div>
    <button id="enterBtn" class="btn primary full" type="submit">Entrar</button>
   </form>
   <button id="backCreate" class="btn soft full" type="button" style="margin-top:8px">Voltar</button>
  </section>
 </div>
</div>

<div id="app" class="hidden">
 <header class="top">
  <div class="brand"><div class="logo">BI</div><div><b id="teamTitle">Equipe</b></div></div>
  <div class="top-actions">
   <span id="connection" class="status-dot AGUARDANDO" title="Conectando"></span>
   <button id="switchTeam" class="icon-btn" type="button" title="Trocar equipe" aria-label="Trocar equipe" style="background:#1e293b;color:#cbd5e1"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
  </div>
 </header>
 <main class="container">
  <div id="teamCodeBox" class="accesscode hidden">
   <div class="row between">
    <span id="teamCodeText"></span>
    <button id="copyTeamCode" class="icon-btn dark" type="button" title="Copiar" aria-label="Copiar" style="background:var(--navy);color:#fff"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
   </div>
  </div>

  <section class="panel">
   <div class="searchbox">
    <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
    <input id="search" placeholder="Código ou descrição..." autocomplete="off">
    <div id="options" class="dropdown hidden"></div>
   </div>
   <div id="chosen" class="countbox hidden">
    <div id="chosenCode" class="code"></div>
    <div id="chosenDesc" class="desc"></div>
    <div id="chosenUnit" class="unit"></div>
    <div class="qty-row">
     <div class="field"><label>Qtd</label><input id="qty" type="number" min="0" step=".001" inputmode="decimal" placeholder="0"></div>
     <button id="toggleObs" class="icon-btn obs-toggle" type="button" title="Observação" aria-label="Observação"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
    </div>
    <div id="obsWrap" class="obs-field hidden">
     <div class="field"><label>Observação</label><textarea id="observation" maxlength="1000" placeholder="Opcional"></textarea></div>
    </div>
    <button id="save" class="btn primary full" type="button" style="margin-top:12px"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Salvar</button>
   </div>
  </section>

  <section class="panel">
   <div class="row between">
    <button id="toggleOwnList" class="own-list-toggle" type="button" aria-expanded="true">
     <span>Minhas contagens</span>
     <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <span class="stat-chip"><strong id="ownTotal">0</strong></span>
   </div>
   <div id="ownListContent">
    <div class="own-filter">
     <select id="ownStatusFilter">
      <option value="TODOS">Todos</option>
      <option value="OK">OK</option>
      <option value="DIVERGENTE">Divergente</option>
      <option value="AGUARDANDO">Aguardando</option>
     </select>
    </div>
    <div id="ownList" class="list"></div>
   </div>
  </section>
 </main>
</div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="./app.js"></script>
</body></html>
